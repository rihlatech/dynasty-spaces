<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/dynasty-favicon.png"
    />

    <!-- Responsive Design -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO -->
    <title>
      Dynasty Spaces | Real Estate & Property Developments in Nairobi Kenya
    </title>

    <meta
      name="description"
      content="Dynasty Spaces is a real estate company specializing in property developments, quality homes, and real estate investment opportunities in Kenya."
    />

    <meta
      name="keywords"
      content="Dynasty Spaces, real estate Kenya, property developments Kenya, properties for sale Kenya, real estate investment Kenya, homes for sale Kenya"
    />

    <meta
      name="author"
      content="Dynasty Spaces"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://dynastyspace.com/"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Dynasty Spaces | Real Estate & Property Developments in Nairobi Kenya"
    />

    <meta
      property="og:description"
      content="Explore quality property developments, homes, and real estate investment opportunities with Dynasty Spaces."
    />

    <meta
      property="og:url"
      content="https://dynastyspace.com/"
    />

    <meta
      property="og:site_name"
      content="Dynasty Spaces"
    />

    <meta
      property="og:image"
      content="https://dynastyspace.com/dynasty_meta_logo.jpeg"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Dynasty Spaces | Real Estate & Property Developments in Kenya"
    />

    <meta
      name="twitter:description"
      content="Explore quality property developments, homes, and real estate investment opportunities with Dynasty Spaces."
    />

    <meta
      name="twitter:image"
      content="https://dynastyspace.com/dynasty_meta_logo.jpeg"
    />

    <!-- Browser Theme -->
    <meta
      name="theme-color"
      content="#000000"
    />
  </head>

    <script
      type="module"
      src="/src/main.jsx"
